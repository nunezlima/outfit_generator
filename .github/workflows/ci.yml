# Revisión automática en cada cambio: que no se cuelen secretos, tipos,
# pruebas unitarias, aislamiento entre usuarios (RLS) y que la app compile.
# No usa ningún secret: corre igual en pull requests de forks.
#
# Las actions van fijadas por SHA (una etiqueta se puede mover a otro código).
# Dependabot propone las actualizaciones (ver .github/dependabot.yml).

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buscar secretos subidos por accidente
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "::error::Hay un archivo .env en el repositorio. Bórralo, rota las claves (ver README) y vuelve a subir."
            exit 1
          fi
          # JWT (claves anon/service_role antiguas), claves nuevas y URLs reales de proyectos.
          if git grep -nIE 'eyJhbGciOi[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}|sb_(secret|publishable)_[A-Za-z0-9_-]{10,}|https://[a-z]{20}\.supabase\.co' -- . ':!package-lock.json'; then
            echo "::error::Parece haber una clave o la URL real de Supabase en el código. Usa variables de entorno."
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Bloquea solo lo que llega al navegador: las herramientas de desarrollo
      # se actualizan con Dependabot.
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rls:
    name: Aislamiento entre usuarios (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # Postgres desechable y sin red: aplica todas las migraciones y prueba
      # que un usuario no pueda leer ni modificar los datos de otro.
      - run: npm run test:rls

  secretos:
    name: Secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (valores ocultos en la salida)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --log-opts="--all"
