# Revisión automática en cada cambio: que no se cuelen secretos, tipos,
# pruebas unitarias y que la app compile.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Buscar secretos subidos por accidente
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "::error::Hay un archivo .env en el repositorio. Bórralo, rota las claves (ver README) y vuelve a subir."
            exit 1
          fi
          # JWT (claves anon/service_role antiguas), claves nuevas y URLs reales de proyectos.
          if git grep -nIE 'eyJhbGciOi[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}|sb_(secret|publishable)_[A-Za-z0-9_-]{10,}|https://[a-z]{20}\.supabase\.co' -- . ':!package-lock.json'; then
            echo "::error::Parece haber una clave o la URL real de Supabase en el código. Usa variables de entorno."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
