# Aplica a Supabase las migraciones NUEVAS de supabase/migrations cada vez que
# subes cambios a main. Las claves vienen de GitHub Secrets (nunca del código):
#   SUPABASE_ACCESS_TOKEN  token personal (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos del proyecto
#   SUPABASE_PROJECT_ID    "Reference ID" del proyecto (Project Settings → General)
# También puedes ejecutarla a mano: pestaña Actions → "Migraciones de Supabase" → Run workflow.

name: Migraciones de Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

# Nunca dos migraciones a la vez contra la misma base.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Aplicar migraciones
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Revisar que los secrets existen
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secret $v (repositorio → Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Si un paso falla, sus últimas líneas se publican como anotación de
      # error (visibles en el resumen de la ejecución, sin abrir el registro).
      - name: Vincular el proyecto
        run: |
          set -o pipefail
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID" 2>&1 | tee link.log; then
            echo "::error title=supabase link falló::$(tail -n 6 link.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Ver qué se va a aplicar
        run: |
          set -o pipefail
          if ! supabase db push --dry-run 2>&1 | tee dry.log; then
            echo "::error title=supabase db push --dry-run falló::$(tail -n 6 dry.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Aplicar migraciones nuevas
        run: |
          set -o pipefail
          if ! supabase db push --yes --skip-vault 2>&1 | tee push.log; then
            echo "::error title=supabase db push falló::$(tail -n 6 push.log | tr '\n' ' ')"
            exit 1
          fi
