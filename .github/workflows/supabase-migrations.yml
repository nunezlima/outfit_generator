# Aplica a Supabase las migraciones NUEVAS de supabase/migrations cada vez que
# subes cambios a main. Las claves vienen de GitHub Secrets (nunca del código):
#   SUPABASE_ACCESS_TOKEN  token personal (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   contraseña de la base de datos del proyecto
#   SUPABASE_PROJECT_ID    "Reference ID" del proyecto (Project Settings → General)
# También puedes ejecutarla a mano: pestaña Actions → "Migraciones de Supabase" → Run workflow.

name: Migraciones de Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

# Nunca dos migraciones a la vez contra la misma base.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Aplicar migraciones
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Revisar que los secrets existen
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secret $v (repositorio → Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Ver qué se va a aplicar
        run: supabase db push --dry-run

      - name: Aplicar migraciones nuevas
        run: supabase db push --yes --skip-vault
